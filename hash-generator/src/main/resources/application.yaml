server:
  port: 8082

spring:
  application:
    name: hash-generator
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    hash-seed-sequence-name: ${HASH_SEED_SEQ_NAME}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      database: ${REDIS_DATABASE}
      password: ${REDIS_PASSWORD}

hash:
  properties:
    cache:
      size: ${HASH_CASH_SIZE}
      redis-key-name: ${HASH_CASH_REDIS_KEY_NAME}
