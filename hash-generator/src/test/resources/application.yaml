spring:
  application:
    name: hash-generator
  datasource:
    url: jdbc:tc:postgresql:16:///pastebin_hash_generator_db?TC_DAEMON=true
    username: postgres
    password: postgres
    hash-seed-sequence-name: hash_seed_seq
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password: default

hash:
  properties:
    cache:
      size: 1
      redis-key-name: _
    length:
      upper-bound: 16

